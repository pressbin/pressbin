server:
  port: 8080
  host: 0.0.0.0

database:
  # Relative to this file (not the process working directory), so Air/IDE cwd still finds the same DB.
  path: ./pressbin.db

site:
  title: "My Blog"
  description: "Writing about Go and things."
  url: "http://localhost:8080"
  posts_per_page: 10

theme:
  # Optional. Absolute URL to a custom CSS file loaded after the default theme CSS.
  # Example: https://cdn.example.com/pressbin/custom.css
  custom_css_url: "http://localhost:7331/dracula.css"

# Synced assets are uploaded via POST /api/sync/asset.
assets:
  upload:
    driver: local
    # This example points at the content repo's `assets/` directory (monorepo dev).
    # In production, set this to something like: /home/you/public_html/assets
    storage_path: ../pressbin_blog/assets

  allowed_prefixes: ["images/", "fonts/", "downloads/", "css/"]

log:
  level: info

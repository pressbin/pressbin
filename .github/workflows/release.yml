name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Embedded build version (e.g. v1.0.0-rc1 or sha-abc1234)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.ref_type == 'tag'
      && !contains(github.ref_name, 'alpha')
      && !contains(github.ref_name, 'beta'))
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Resolve build version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER='${{ github.ref_name }}'
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VER='${{ github.event.inputs.version }}'
          else
            VER="sha-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Building with embedded version: $VER"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: |
          chmod +x scripts/build-release.sh
          scripts/build-release.sh "${{ steps.version.outputs.version }}"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum pressbin-* > checksums.txt

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          files: |
            dist/*
          body: |
            ## Pressbin ${{ github.ref_name }}

            Version is embedded at link time (`main.Version`).

            ### Download
            | Platform | File |
            |---|---|
            | Linux x64 (most VPS) | `pressbin-linux-amd64` |
            | Linux ARM64 | `pressbin-linux-arm64` |
            | Mac Intel | `pressbin-darwin-amd64` |
            | Mac Apple Silicon | `pressbin-darwin-arm64` |
            | Windows | `pressbin-windows-amd64.exe` |

            Copy [config.yml.example](https://github.com/${{ github.repository }}/blob/main/config.yml.example) to `config.yml`, then run `./pressbin --config config.yml`.

            For git-push publishing, use the [blog content template](https://github.com/pressbin/pressbin-blog-template).

            ### Verify checksum
            ```bash
            sha256sum -c checksums.txt
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Embedded build version (e.g. v1.0.0-rc1 or sha-abc1234)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Gate (skip alpha/beta tags)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "${{ github.ref_name }}" | grep -qiE 'alpha|beta'; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: pre-release tag ${{ github.ref_name }} (alpha/beta not built)"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Go
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Resolve build version
        if: steps.gate.outputs.run == 'true'
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VER='${{ github.ref_name }}'
          elif [ -n "${{ inputs.version }}" ]; then
            VER='${{ inputs.version }}'
          else
            VER="sha-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Building with embedded version: $VER"

      - name: Vet
        if: steps.gate.outputs.run == 'true'
        run: go vet ./...

      - name: Test
        if: steps.gate.outputs.run == 'true'
        run: go test ./...

      - name: Build binaries
        if: steps.gate.outputs.run == 'true'
        run: |
          chmod +x scripts/build-release.sh
          scripts/build-release.sh "${{ steps.version.outputs.version }}"

      - name: Generate checksums
        if: steps.gate.outputs.run == 'true'
        run: |
          cd dist
          sha256sum pressbin-* > checksums.txt

      - name: Create GitHub Release
        if: steps.gate.outputs.run == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          files: |
            dist/pressbin-*
            dist/checksums.txt
          body: |
            ## Pressbin ${{ github.ref_name }}

            Version is embedded at link time (`main.Version`).

            ### Download
            | Platform | File |
            |---|---|
            | Linux x64 (most VPS) | `pressbin-linux-amd64` |
            | Linux ARM64 | `pressbin-linux-arm64` |
            | Mac Intel | `pressbin-darwin-amd64` |
            | Mac Apple Silicon | `pressbin-darwin-arm64` |
            | Windows | `pressbin-windows-amd64.exe` |

            ### Install (no root)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash -s -- \
              --site-url https://your-domain.com
            export PATH="$HOME/.pressbin/bin:$PATH"
            pressbin serve
            ```

            Keys: `~/.pressbin/admin.key` (admin API), `~/.pressbin/sync.key` (GitHub Actions).

            ### Content sync (GitHub Actions)
            Blog repos download `pressbin-sync-linux-amd64` from this release (version from `GET /api/version` on your instance). No Python scripts in content repos.

            For git-push publishing, use the [blog content template](https://github.com/pressbin/pressbin-blog-template).

            ### Verify checksum
            ```bash
            sha256sum -c checksums.txt
            ```

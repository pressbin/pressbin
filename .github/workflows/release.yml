name: CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Stable release: v1.0.0, v1.1.1 (not v1.0.0-beta, v1.0.0-alpha.1, v1.0.0-rc.1)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Smoke build
        if: github.ref_type != 'tag'
        run: go build -ldflags="-s -w" -o pressbin .

      - name: Build release binaries
        if: github.ref_type == 'tag' && matches(github.ref_name, '^v[0-9]+\.[0-9]+\.[0-9]+$')
        run: |
          chmod +x scripts/build-release.sh
          scripts/build-release.sh "${{ github.ref_name }}"

      - name: Generate checksums
        if: github.ref_type == 'tag' && matches(github.ref_name, '^v[0-9]+\.[0-9]+\.[0-9]+$')
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        if: github.ref_type == 'tag' && matches(github.ref_name, '^v[0-9]+\.[0-9]+\.[0-9]+$')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          body: |
            ## Pressbin ${{ github.ref_name }}

            ### Download
            Pick the binary for your platform:

            | Platform | File |
            |---|---|
            | Linux x64 (most VPS) | `pressbin-linux-amd64` |
            | Linux ARM64 | `pressbin-linux-arm64` |
            | Mac Intel | `pressbin-darwin-amd64` |
            | Mac Apple Silicon | `pressbin-darwin-arm64` |
            | Windows | `pressbin-windows-amd64.exe` |

            Copy [config.yml.example](https://github.com/${{ github.repository }}/blob/main/config.yml.example) to `config.yml`, then run `./pressbin --config config.yml`.

            For git-push publishing, use the [blog content template](https://github.com/pressbin/pressbin-blog-template) (sync workflow + `push.py`).

            ### Verify checksum
            ```bash
            sha256sum -c checksums.txt
            ```

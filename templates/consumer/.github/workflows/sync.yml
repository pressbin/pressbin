name: Sync content to Pressbin

on:
  push:
    branches: [main]
    paths:
      - "posts/**/*.md"
      - "posts/*.md"
      - "assets/images/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'push' && 2 || 1 }}

      - name: Sync to Pressbin
        env:
          PRESSBIN_URL: ${{ secrets.PRESSBIN_URL }}
          PRESSBIN_KEY: ${{ secrets.PRESSBIN_KEY }}
          PRESSBIN_RELEASE_REPO: pressbin/pressbin
          # Optional: pin client version when server reports "dev"
          # PRESSBIN_SYNC_VERSION: v1.0.0
        run: |
          set -euo pipefail

          VERSION="${PRESSBIN_SYNC_VERSION:-}"
          if [ -z "$VERSION" ]; then
            VERSION="$(curl -fsSL "${PRESSBIN_URL%/}/api/version" | jq -r '.version')"
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "error: could not resolve version from ${PRESSBIN_URL}/api/version" >&2
            echo "Set repository variable PRESSBIN_SYNC_VERSION to a release tag (e.g. v1.0.0)." >&2
            exit 1
          fi
          echo "Pressbin server version: $VERSION"

          ASSET="pressbin-sync-linux-amd64"
          BASE="https://github.com/${PRESSBIN_RELEASE_REPO}/releases/download/${VERSION}"
          curl -fsSL "$BASE/${ASSET}" -o "${ASSET}"
          curl -fsSL "$BASE/checksums.txt" -o checksums.txt
          grep " ${ASSET}\$" checksums.txt | sha256sum -c -
          chmod +x "${ASSET}"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run: full sync (all posts and assets)"
            ./"${ASSET}" run --all "$GITHUB_WORKSPACE"
          else
            ./"${ASSET}" run "$GITHUB_WORKSPACE"
          fi

name: Sync posts to Pressbin

on:
  push:
    branches: [main]
    paths:
      - "posts/**/*.md"
      - "posts/*.md"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Sync posts
        env:
          PRESSBIN_URL: ${{ secrets.PRESSBIN_URL }}
          PRESSBIN_KEY: ${{ secrets.PRESSBIN_KEY }}
        run: |
          set -e
          shopt -s globstar nullglob

          sync_file() {
            echo "Syncing $1..."
            python3 .github/scripts/push.py "$1"
          }

          delete_file() {
            echo "Deleting $1..."
            python3 .github/scripts/delete.py "$1"
          }

          if ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "First push: syncing all posts under posts/"
            while IFS= read -r -d '' file; do
              sync_file "$file"
            done < <(find posts -type f -name '*.md' -print0)
            exit 0
          fi

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            delete_file "$file"
          done < <(git diff --diff-filter=D --name-only HEAD~1 HEAD -- 'posts/*.md' 'posts/**/*.md')

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ -f "$file" ] || continue
            sync_file "$file"
          done < <(git diff --name-only HEAD~1 HEAD -- 'posts/*.md' 'posts/**/*.md')

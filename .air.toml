root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ."
  args_bin = ["--config", "config.yml"]
  delay = 1000
  exclude_dir = ["tmp", "vendor", ".git", "bin"]
  exclude_regex = ["_test\\.go"]
  include_ext = ["go", "mod", "sum", "css", "yml", "yaml"]
  kill_delay = "0s"
  send_interrupt = true
  stop_on_error = true

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = true

[misc]
  clean_on_exit = true
